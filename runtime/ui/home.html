<!doctype html>
<!-- Home · TA 的家(唯一产品主场)
     左导航 + 关系问候 + 底部大输入 + 右栏(今日待办/正在进行/最近记忆 + TA 状态卡)
     聊天链路自 index.html 迁入:流式/停止/重试/上下文连续;Task State 状态角标(人话)。
     视觉地基走 ui.css 令牌；输入条矩形化 + ＋ 上拉框；撤中央 Live2D（形象只留桌面宠物窗）+ 情绪条 + 文件芯片。 -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title data-i18n="home.page.1">灵核 · 家</title>
<link rel="stylesheet" href="./ui.css">
<style>
/* ---------- 页面级布局(颜色一律取 ui.css Token) ---------- */
html, body { height: 100%; }
body { overflow: hidden; }

/* ⚠ **黄昏城市花田那四层场景整个删掉**——
   天空渐变 / 远近两组城市剪影 / 底下一排花草，连 clip-path 一起。
   纸白极简：底就是 --bg（#F7F7F8），卡片是实白 + 1px 细线，不再有"场景"。 */

/* ---------- 中央:情绪条 + 聊天流 ---------- */
.hero { position: absolute; top: 0; bottom: 0; left: 168px; right: 264px;   /* 左 = 导航宽 */   /* = 右栏宽 */ display: flex; flex-direction: column; z-index: 3; }

/* 情绪条 —— 替掉原来的「问候语」与右栏那张紫色 TA 卡。
   一眼看完四件事：光球颜色=她的心情 · 心情词 · 一句今天真发生的事 · 这周曲线。
   底是恒定浅色（「深色=框架与日程，浅色=对话与输入」），所以文字走 --ink-on-solid 族。 */
.mood { margin: 16px 22px 0; padding: 11px 13px; border-radius: var(--radius-card); flex: none;
  background: var(--scene-glass); backdrop-filter: blur(14px); border: 1px solid var(--scene-glass-strong);
  box-shadow: var(--shadow-soft); display: flex; gap: 12px; align-items: center; color: var(--ink-on-solid); }
.mood .orb { width: 44px; height: 44px; border-radius: 50%; flex: none; cursor: pointer;
  background: radial-gradient(circle at 38% 32%, var(--orb-core), var(--mood) 78%);
  box-shadow: 0 0 0 4px var(--scene-glass-strong), 0 0 22px color-mix(in srgb, var(--mood) 55%, transparent);
  animation: breathe 5.6s var(--ease) infinite; }
.mood .mm { flex: 1; min-width: 0; }
.mood .l1 { display: flex; align-items: center; gap: 8px; font-size: var(--fs-sm); color: var(--ink2-on-solid); flex-wrap: wrap; }
.mood .l1 b { font-size: var(--fs-body); color: var(--ink-on-solid); letter-spacing: .3px; }
.mood .l1 .sep { width: 3px; height: 3px; border-radius: 50%; background: var(--muted); flex: none; }
.mood .l1 .mw { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: var(--r-rect);
  font-weight: 600;
  background: color-mix(in srgb, var(--mood) 16%, transparent);
  color: color-mix(in srgb, var(--mood) 72%, var(--ink-on-solid)); }
.mood .l1 .mw .dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; flex: none; }
.mood .l2 { font-size: var(--fs-body); color: var(--ink-on-solid); margin-top: 5px; line-height: 1.55;
  overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.mood .mright { flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }
.mood .spark { display: flex; align-items: center; gap: 7px; font-size: var(--fs-xs); color: var(--ink2-on-solid); }
.mood .spark svg { display: block; }
.mood .modechip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px; border-radius: var(--r-rect);
  font-size: var(--fs-xs); color: var(--ink2-on-solid); background: var(--scene-glass);
  border: 1px solid var(--scene-glass-strong); cursor: pointer; }
.mood .modechip:hover { background: var(--scene-glass-strong); }
/* 模式胶囊——放在情绪条右端；
   情绪条是恒定浅底，所以它也跟着变成浅底小胶囊，「工作中」那一档用深底区分开 */
.mood .modechip .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--ok); flex: none; }
.mood .modechip .lock { font-size: 11px; opacity: .72; }
.mood .modechip.work { background: var(--panel); border-color: transparent; color: var(--white); }
.mood .modechip.work .dot { background: var(--accent); }
.modepop { position: absolute; top: 116px; right: 0;
  width: 344px; padding: 14px 15px; z-index: 30; text-align: left; }
.modepop[hidden] { display: none; }
.modepop .ph { font-size: 12.5px; font-weight: 600; display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
.modepop .ps { font-size: 11px; color: var(--ink2); margin-bottom: 8px; }
.modepop .opt { display: flex; align-items: flex-start; gap: 9px; padding: 8px 10px; border-radius: 11px; font-size: 12.5px; cursor: pointer; }
.modepop .opt:hover { background: var(--row); }
.modepop .opt.on { background: var(--accent-soft); }
.modepop .opt .rd { width: 15px; height: 15px; border-radius: 50%; border: 1.5px solid var(--muted); flex: none; margin-top: 2px; }
.modepop .opt.on .rd { border: 5px solid var(--accent); }
.modepop .opt .ot { font-weight: 600; }
.modepop .opt .od { font-size: 11px; color: var(--ink2); margin-top: 2px; line-height: 1.6; }
.modepop .pf { border-top: 1px solid var(--line); margin-top: 7px; padding-top: 8px; font-size: 11px; color: var(--ink2); line-height: 1.7; }

/* 聊天流:叠在场景上方,安静时收起,说话时浮现(出现/收起纪律 anim-in) */
/* 整块铺满中栏，没有卡片边框；
   可读性靠一层从顶部渐隐的薄纱（scrim），而不是"白卡片" */
#chatlog { position: absolute; top: 112px; left: 0; right: 0; bottom: 170px;   /* 让开情绪条 */ overflow-y: auto;
  padding: 14px clamp(20px, 4vw, 56px) 14px; z-index: 5; display: none;
  background: linear-gradient(180deg, var(--w-30) 0%, var(--w-20) 62%, rgba(255,255,255,0) 100%);
  backdrop-filter: blur(7px) saturate(1.05);
  mask-image: linear-gradient(180deg, var(--black) 0%, var(--black) 86%, transparent 100%);
  -webkit-mask-image: linear-gradient(180deg, var(--black) 0%, var(--black) 86%, transparent 100%); }
#chatlog.open { display: block; }
#chatlog .veil { max-width: none; margin: 0; background: none; backdrop-filter: none; border-radius: 0; padding: 0; }
/* 全铺：她的话直接铺在场景上（无框）；你自己的话留一条小胶囊，好分清谁说的 */
#chatlog .msg.ta .m-bubble { background: none; box-shadow: none; padding: 2px 0; max-width: 100%; }
#chatlog .msg .m-bubble.md .md-p { line-height: 1.85; }
#chatlog .msg.me .m-bubble { max-width: min(78%, 620px); box-shadow: 0 6px 18px var(--bubble-shadow-me); }
#chatlog .msg { margin: 8px 0; }
  /* **回到这句重说**——只有我的消息挂这个动作，平时藏起来，悬浮/聚焦才露头 */
  .msg.lookback-able .lookback { opacity: 0; transition: opacity .12s; }
  .msg.lookback-able:hover .lookback, .msg.lookback-able:focus-within .lookback { opacity: 1; }
  .lookback { display: inline-flex; align-items: center; gap: 4px; margin: 4px 2px 0 auto;
    font: inherit; font-size: var(--fs-xs); color: var(--ink2); background: none; border: 0;
    padding: 2px 6px; border-radius: 999px; cursor: pointer; }
  .lookback:hover { background: var(--row); color: var(--ink); }
  .msg.me .lookback { margin-left: auto; }
  /* 分支小标：换到新分支时挂在对话区顶上 */
  #branch-bar { display: none; align-items: center; gap: 8px; margin: 0 0 8px;
    padding: 6px 10px; border-radius: var(--r-rect); background: var(--row);
    font-size: var(--fs-xs); color: var(--ink2); }
  #branch-bar.on { display: flex; }
  #label-bar { display: flex; justify-content: flex-end; margin: 0 0 4px; }
  #label-bar button { font: inherit; font-size: var(--fs-xs); color: var(--ink2); background: none; border: 0;
    border-radius: 999px; padding: 2px 8px; cursor: pointer; }
  #label-bar button:hover { background: var(--row); color: var(--ink); }
  #label-bar .label-n { margin-left: 1px; opacity: .85; }
  #branch-bar button { font: inherit; font-size: var(--fs-xs); color: var(--accent); background: none;
    border: 0; cursor: pointer; text-decoration: underline; padding: 0; }

/* ---------- 底部大输入(矩形语言;落在导航与右栏之间,不越界被压) ----------
   圆胶囊 → 直角矩形；左端新增「＋ 想让她做什么」上拉框
   （原「文件处理 / 深度思考」两张浮卡撤掉——文件处理进上拉框，深度思考删）。
   底是恒定浅色（不随主题翻转，「深色=框架与日程，浅色=对话与输入」），
   所以文字走 --ink-on-solid 那一族；用 --ink 的话深色模式下是近白色，落白底上会看不见。 */
/* ⚠ 命中区现在靠 textarea 自己的 min-height:40 拿到
   （原来是 `<input align-self:stretch>` 撑满整行那条路——换成多行输入后不再适用）。
   框本身 min-height 60 保底：一行字 + 工具行就是这个高度。 */
/* 从"一行 flex"改成**一个大圆角框**（竖排三层：附件 / 文字 / 工具行）。
   底与文字仍是原来那族恒定浅色（「深色=框架与日程，浅色=对话与输入」），只换形状。 */
.hinp { position: absolute; bottom: 34px; left: 198px; right: 294px; min-height: 60px;
  border-radius: var(--radius-composer);
  display: flex; flex-direction: column; align-items: stretch; gap: 8px; padding: 11px 12px 9px; z-index: 6;
  /* 纸白底上，白框 + 1px 细线**分不出边界**。
     底色改用 --card（实白），阴影换成"近实远虚"两层——它是个浮在对话上的卡，本来就该有浮起感；
     原来那句 --shadow-pop 是一团 34px 的紫黑雾，在纸白底上几乎看不见。 */
  background: var(--card); border: 1px solid var(--line);
  box-shadow: 0 8px 24px -14px var(--scrim-30), 0 1px 3px var(--scrim-22);
  color: var(--ink-on-solid); }
/* 框内工具行（toolrow）：左侧是"想让她做什么 / 📎 / 快捷键提示"，右侧是"语音 / 插话 / 发送" */
.hinp .toolrow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.hinp .toolrow .spacer { flex: 1; min-width: 8px; }
/* 只读的当前权限档（toolrow 中间那枚） */
.hinp .perm { flex: none; position: relative; display: inline-flex; align-items: center; gap: 4px;
  padding: 5px 9px; border-radius: var(--radius-pill); background: var(--row);
  font-size: var(--fs-xs); color: var(--ink2-on-solid); white-space: nowrap;
  transition: background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease); }
.hinp .perm:hover { background: var(--accent-soft); color: var(--accent); }
.hinp .perm::after { content: ''; position: absolute; inset: -8px -4px; }   /* 命中区 ≥40（高 25 → 41） */
/* 弹层从输入条里弹出来时，贴着输入条上沿（同一个弹层，只是换了个落点） */
.hinp .modepop { top: auto; bottom: calc(100% + 10px); right: 0; }
/* 命中区：工具行里的钮**视觉尺寸 30~32px**，
   可点区域用 ::after 撑到 ≥40×40。横向只撑 4px：行间距是 8px，撑 5px 就会与邻居的命中区重叠
   （点"📎"会落到"想让她做什么"上，比命中区小更糟——这条在对话房间的预览工具条上踩过）。 */
.hinp .plus, .hinp .ghost { position: relative; }
.hinp .plus::after { content: ''; position: absolute; inset: -6px -4px; }
.hinp .ghost::after { content: ''; position: absolute; inset: -4px; }
/* 多行输入（原来是单行 input）：1 行起步，最多长到 5 行左右再由内部滚动 —— 由 JS 调高度 */
.hinp textarea { width: 100%; border: none; outline: none; background: none; resize: none;
  font-size: var(--fs-body); line-height: 1.65; color: var(--ink-on-solid);
  min-height: 42px; max-height: 132px; overflow-y: auto; padding: 2px 2px 0; font-family: inherit; }
.hinp textarea::placeholder { color: var(--ink3-on-solid); }
/* ＋ 想让她做什么（点开是向上弹出的选择框） */
.hinp .plus { flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px;
  border-radius: var(--radius-pill); background: var(--accent-veil); color: var(--accent);
  font-size: var(--fs-sm); font-weight: 600; white-space: nowrap;
  transition: background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease); }
.hinp .plus:hover { background: var(--accent-veil-2); }
.hinp .plus.on { background: var(--accent); color: var(--white); }
.hinp .plus svg { display: block; }
/* 上拉框：贴着输入条上沿弹出（绝对定位 = 不参与 flex 行，绝不挤动输入条本身） */
.hinp .up { position: absolute; left: 8px; right: 8px; bottom: calc(100% - 10px); z-index: 30; }
.hinp .up[hidden] { display: none; }
.hinp .up .in { width: min(430px, 76%); padding: 11px 12px; border-radius: var(--radius-card);
  background: var(--card);
  border: 1px solid var(--line); box-shadow: var(--shadow-pop); animation: rise var(--dur) var(--ease); }
.hinp .up .th { font-size: var(--fs-xs); color: var(--ink2-on-solid); margin-bottom: 8px; }
.hinp .up .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.hinp .up .it { display: flex; align-items: center; gap: 9px; padding: 8px 9px; border-radius: var(--r-rect);
  cursor: pointer; text-align: left; transition: background var(--dur-fast) var(--ease); }
.hinp .up .it:hover { background: var(--accent-soft); }
.hinp .up .it .ii { width: 26px; height: 26px; border-radius: var(--r-rect); flex: none;
  display: flex; align-items: center; justify-content: center; background: var(--accent-soft); color: var(--accent); }
.hinp .up .it b { display: block; font-size: var(--fs-sm); font-weight: 600; color: var(--ink-on-solid); }
.hinp .up .it i { font-style: normal; font-size: var(--fs-xs); color: var(--ink2-on-solid); }
.hinp .up .ft { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line);
  font-size: var(--fs-xs); color: var(--ink2-on-solid); }
.hinp .kb { font-size: var(--fs-xs); color: var(--ink3-on-solid); border: 1px solid var(--line); border-radius: var(--r-rect); padding: 3px 7px; flex: none; }
.hinp .ghost { flex: none; width: 34px; height: 34px; border: none; border-radius: var(--radius-pill); background: none; color: var(--ink3-on-solid);
  display: flex; align-items: center; justify-content: center; cursor: pointer;
  transition: color var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease); }
.hinp .ghost svg { display: block; }
.hinp .ghost:hover { background: var(--accent-soft); color: var(--accent); }
/* 「插话 / 排队」切换（TA 忙时才出现）：视觉与 .ghost 同族，但按文字宽度撑开 */
.hinp .ghost.wide { width: auto; padding: 0 10px; font-size: var(--fs-sm); }
.hinp .send { width: 36px; height: 36px; border-radius: var(--radius-pill); background: var(--grad); color: var(--white); font-size: 17px;
  box-shadow: 0 4px 12px var(--glow); flex: none; display: flex; align-items: center; justify-content: center;
  transition: transform var(--dur-fast) var(--ease); }
.hinp .send:hover { transform: translateY(-1px); }
.hinp .send.stop { background: var(--danger); box-shadow: 0 4px 12px var(--rose-a40); }

/* ---------- 右栏：一块深玻璃（上=日历，下=今日待办）----------
   原来那四张卡（今日待办 / 正在进行 / 最近记忆 / 日历）合成**一块深玻璃**，
   与左导航同一族（--glass / --glass-line / --ink-g*）—— 避免日历太白、与整体色调不一致。
   卡里不再有自己的白底，右栏整体就是那块玻璃。 */
.rail { position: absolute; top: 0; bottom: 0; right: 0; width: 264px; z-index: 6;
  display: flex; flex-direction: column; padding: 14px 12px 12px;
  background: var(--glass); backdrop-filter: blur(18px); border-left: 1px solid var(--glass-line);
  color: var(--ink-g); overflow: hidden; }
.rsect { display: flex; flex-direction: column; min-height: 0; }
.rhead { display: flex; align-items: center; gap: 7px; font-size: var(--fs-sm); font-weight: 600;
  color: var(--ink-g); margin-bottom: 9px; }
.rhead .xtra { margin-left: auto; font-size: var(--fs-xs); font-weight: 400; color: var(--ink-g3); cursor: pointer; }
.rhead .xtra:hover { color: var(--ink-g); }
.rail .hr { height: 1px; background: var(--glass-line); margin: 11px 0 12px; flex: none; }

/* 4.1 日历 ——
   ①「日历太白看不清」→ 与左导航同族（就是上面那块玻璃）
   ②「切换年存在溢出 + 大小不能变化」→ 月份网格**永远 6 周（42 格）**、高度写死；
      年/月各弹一个小选择器，不翻页、不换版面 */
.cal { position: relative; }
.cal .ctop { display: flex; align-items: center; gap: 3px; margin-bottom: 9px; }
.cal .cbtn { width: 22px; height: 22px; border-radius: var(--r-rect); background: var(--glass-2);
  color: var(--ink-g2); display: flex; align-items: center; justify-content: center; font-size: var(--fs-sm); line-height: 1; flex: none; }
.cal .cbtn:hover { background: var(--glass-line); color: var(--white); }
.cal #cnext { margin-left: auto; }
.cal .cchip { font-size: var(--fs-sm); font-weight: 600; color: var(--ink-g); letter-spacing: .4px; cursor: pointer;
  padding: 3px 7px; border-radius: var(--r-rect); display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.cal .cchip:hover { background: var(--glass-line); }
.cal .cchip i { font-style: normal; color: var(--ink-g3); font-size: var(--fs-xs); }
.cal .cal-wd, .cal .cal-cells { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
.cal .cal-wd span { text-align: center; font-size: var(--fs-xs); color: var(--ink-g3); padding-bottom: 3px; }
.cal .cd { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center;
  height: 26px; border-radius: var(--r-rect); cursor: pointer; color: var(--ink-g2); transition: background var(--dur-fast); }
.cal .cd:hover { background: var(--glass-line); }
.cal .cd b { font-size: var(--fs-sm); font-weight: 500; line-height: 1.1; }
/* 「休 / 班」角标：守 11px 下限，靠透明度 + 缩一档 + 靠右上让位来"不抢数字" */
.cal .cd u { position: absolute; top: 0; right: 1px; font-size: var(--fs-xs); text-decoration: none;
  opacity: .46; transform: scale(.86); transform-origin: top right; }
.cal .cd-today { background: var(--cal-today); box-shadow: inset 0 0 0 1px var(--cal-today-line); }
.cal .cd-today b { color: var(--white); font-weight: 700; }
.cal .cd-h { color: var(--warn-on-dark); }
.cal .cd-w b { color: var(--ink-g3); }
.cal .cal-empty-cell { height: 26px; }
.cal .cal-note { font-size: var(--fs-xs); color: var(--ink-g3); margin-top: 5px; }
/* 年 / 月选择器（弹出的小面板；不翻页、不换版面） */
.cal .pick { position: absolute; left: 0; right: 0; top: 28px; z-index: 12; border-radius: var(--radius-card);
  background: var(--deep-97); border: 1px solid var(--pri-a28); box-shadow: var(--shadow-pop); padding: 9px 10px; }
.cal .pick[hidden] { display: none; }
.cal .pick .yh { font-size: var(--fs-xs); color: var(--ink-g3); margin-bottom: 7px; }
.cal .pick .yl { max-height: 168px; overflow-y: auto; display: flex; flex-direction: column; gap: 1px; }
.cal .pick .yi { text-align: left; padding: 4px 7px; border-radius: var(--r-rect); font-size: var(--fs-sm); color: var(--ink-g2); }
.cal .pick .yi:hover { background: var(--glass-line); color: var(--white); }
.cal .pick .yi.on { background: var(--grad); color: var(--white); font-weight: 600; }
.cal .pick .mg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 3px; }
.cal .pick .mi { padding: 5px 0; border-radius: var(--r-rect); font-size: var(--fs-sm); color: var(--ink-g2); }
.cal .pick .mi:hover { background: var(--glass-line); color: var(--white); }
.cal .pick .mi.on { background: var(--grad); color: var(--white); font-weight: 600; }

/* 4.2 今日待办（日历下方；优先级 / 来源 / 勾选 / 倒序 / 最多 5 条 / 可加） */
.todo { flex: 1; min-height: 0; }
.todo .tlist { display: flex; flex-direction: column; gap: 2px; }
.todo .ti { display: flex; align-items: flex-start; gap: 8px; padding: 7px; border-radius: var(--r-rect); cursor: pointer;
  transition: background var(--dur-fast) var(--ease); }
.todo .ti:hover { background: var(--glass-2); }
.todo .pi { flex: none; display: inline-flex; align-items: center; gap: 4px; font-size: var(--fs-xs); font-weight: 600;
  padding: 1px 6px; border-radius: var(--r-rect); margin-top: 1px; min-width: 34px; justify-content: center; }
.todo .pi .pd { width: 5px; height: 5px; border-radius: 50%; background: currentColor; flex: none; }
.todo .ti.p1 .pi { color: var(--pri-high-g); background: var(--pri-high-g-bg); }
.todo .ti.p2 .pi { color: var(--pri-mid-g); background: var(--pri-mid-g-bg); }
.todo .ti.p3 .pi { color: var(--pri-low-g); background: var(--pri-low-g-bg); }
.todo .ti.p0 .pi { color: var(--pri-none-g); background: var(--pri-none-g-bg); }
.todo .tt { flex: 1; min-width: 0; font-size: var(--fs-sm); color: var(--ink-g); line-height: 1.45;
  overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.todo .ti.done .tt { opacity: .5; text-decoration: line-through; }
.todo .src { flex: none; font-size: var(--fs-xs); color: var(--ink-g3); margin-top: 2px; white-space: nowrap; }
.todo .src.carry { color: var(--pri-mid-g); }
.todo .ck { flex: none; width: 15px; height: 15px; border-radius: 4px; border: 1.5px solid var(--glass-line); margin-top: 2px;
  display: flex; align-items: center; justify-content: center; font-size: var(--fs-xs); color: transparent; }
.todo .ti:hover .ck { border-color: var(--ink-g2); }
.todo .ti.done .ck { background: var(--ok); border-color: var(--ok); color: var(--white); }
.todo .tadd { display: flex; align-items: center; gap: 7px; margin-top: 6px; padding: 6px 7px; border-radius: var(--r-rect);
  font-size: var(--fs-sm); color: var(--ink-g3); cursor: pointer; border: 1px dashed var(--glass-line); width: 100%; text-align: left; }
.todo .tadd:hover { color: var(--white); border-color: var(--ink-g2); }
.todo .tempty { font-size: var(--fs-sm); color: var(--ink-g3); padding: 7px 0; line-height: 1.7; }

/* 小窗口收窄:右栏变窄,导航保持(任何尺寸不挤坏) */
@media (max-width: 1120px) {
  .hero { right: 228px; }
  .rail { width: 216px; }
  .hinp { right: 258px; }
}
  /* 点某天 → 详情弹框 */
  .dp-mask { position: fixed; inset: 0; background: var(--dp-mask); backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center; z-index: 50; }
  .dp-card { width: min(340px, 84vw); background: var(--deep-94); border: 1px solid var(--pri-a28);
    border-radius: 18px; padding: 16px 18px; color: var(--dp-ink); box-shadow: 0 18px 50px var(--scrim-50); }
  .dp-d { font-size: 17px; font-weight: 700; letter-spacing: .5px; }
  .dp-wd { font-size: 12.5px; font-weight: 400; color: var(--w-60); margin-left: 4px; }
  .dp-l { font-size: 11px; color: var(--scene-glass); margin-top: 3px; }
  .dp-bs { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
  .dp-b { font-size: 11px; padding: 2px 7px; border-radius: 999px; background: var(--w-10); }
  .dp-h { background: var(--habit-1-bg); color: var(--habit-1-ink); }
  .dp-w { background: var(--w-06); color: var(--w-55); }
  .dp-j { background: var(--habit-2-bg); color: var(--ok-mint); }
  .dp-bd { background: var(--habit-3-bg); color: var(--gold-on-glass); }
  .dp-y, .dp-j2 { font-size: 11px; margin-top: 8px; line-height: 1.5; }
  .dp-y span, .dp-j2 span { display: inline-block; width: 22px; height: 20px; line-height: 20px; text-align: center;
    border-radius: 6px; margin-right: 6px; font-size: 11px; }
  .dp-y span { background: var(--habit-2-bg-2); color: var(--ok-mint); }
  .dp-j2 span { background: var(--habit-4-bg); color: var(--habit-4-ink); }
  .dp-y { color: var(--w-78); } .dp-j2 { color: var(--w-60); }
  .dp-add { margin-top: 12px; font-size: 11px; color: var(--w-45); cursor: pointer; }
  .dp-add:hover { color: var(--white); }
</style>
</head>
<body>
  <!-- 左导航：**星形图标即回家键**；导航 8 项 → 6 项。
       删掉的：「首页」（图标就是回家键）·「聊天」（家页本来就是聊天）·「屏幕理解」
       改名的：「我的 TA」→「个性化」；新增的：「新的想法」（只留占位入口，功能本体未定义） -->
  <nav class="snav">
    <div class="nav-brand star-ico" id="nav-brand" title="灵核家（点图标回家）" data-i18n-title="home.nav-brand.1">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" aria-hidden="true">

      <button class="nit" data-nav="files" data-i18n="home.nit.2"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h3.6l1.8 2H19a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg>文件</button>

    </div>
    <!-- 人物卡（点底部名字出来）——数据全是真的：名字/陪伴天数/关系/心情/今天几句话 -->

  <!-- 中央:情绪条 + 聊天流（**撤掉 Live2D**——形象只留在桌面宠物窗口 pet.html；

  <main class="hero">
    <div class="mood" id="mood">

<div id="chatlog"><div class="veil" id="chatlist"></div></div>

  <!-- 底部大输入（矩形 + ＋ 上拉框；原「文件处理 / 深度思考」两张浮卡已撤） -->

    <div class="up" id="up-box" hidden>
      <div class="in">
        <div class="th" data-i18n="home.th.1">想让她做什么？（也可以直接说，不用先选）</div>

          <button class="it" data-act="file"><span class="ii"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8Z"/><path d="M14 3v5h5"/></svg></span><span><b data-i18n="home.it.1">处理文件</b><i data-i18n="home.it.2">读、改、转格式</i></span></button>

          <button class="it" data-act="find"><span class="ii"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-3.5-3.5"/></svg></span><span><b data-i18n="home.it.5">找资料</b><i data-i18n="home.it.6">翻本地、查网上</i></span></button>
          <button class="it" data-act="remind"><span class="ii"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg></span><span><b data-i18n="home.it.7">定个提醒</b><i data-i18n="home.it.8">到点叫她</i></span></button>
        </div>
        <div class="ft" data-i18n="home.ft.1">直接说也行 —— 比如「把这个表转成 PDF」。</div>
      </div>
    </div>
    <!-- 换成**一个大圆角框**，框里三层：
         附件行（截图缩略图 + 文件芯片）→ 多行文字 → 工具行。以前是"一行 flex 里塞下所有东西"，
         附件只能挤在输入框外边。 -->
    <textarea id="input" rows="1" placeholder="说点什么，或者把截图粘进来（⌘V）" autocomplete="off" data-i18n-placeholder="home.input.1"></textarea>
    <div class="toolrow">
      <button class="plus" id="plus-btn" aria-expanded="false" title="想让她做什么（点开挑一个，也可以直接打字）" data-i18n-title="home.plus-btn.1" data-i18n="home.plus-btn.2">

      <button class="send" id="send" title="发送" data-i18n-title="home.send.1">➤</button>

  </div>

  <!-- 右栏：**一块深玻璃**，上=日历、下=今日待办。
       原「今日待办 / 正在进行 / 最近记忆 / 日历」四张白卡已合掉：
       · 最近记忆 —— 已删；要看记忆走左导航「记忆」
       · 正在进行 / 工作台 —— 能力已搬进结果卡；"她正在干什么"由情绪条第 2 行承担

  <aside class="rail">
    <section class="rsect cal" id="sec-cal">
      <div class="ctop">

        <div class="mg" id="mlist"></div>
      </div>
    </section>
    <div class="hr"></div>
    <section class="rsect todo" id="sec-todo">
      <div class="rhead"><span data-i18n="home.rhead.1">今日待办</span><span class="xtra" id="todo-all" style="display:none"></span></div>
      <div class="tlist" id="todo-list"></div>
      <button class="tadd" id="todo-add" data-i18n="home.todo-add.1">＋ 加一条</button>
    </section>
  </aside>

<script>
'use strict';
const $ = (id) => document.getElementById(id);
const h = UI2.h;
/** HTML 转义（此前日历卡异步渲染时静默抛错，卡片一直是空的——用户看到的就是"又一个假功能"。
 *  凡是往 innerHTML 里塞外部文本，都必须先过它。） */
/* 模式状态（家页胶囊 / 工作台都读它）——放在最前，初始化路径上就要用 */
const MODE_STATE = { mode: 'chat', locked: false };
const APPROVAL_STATE = { scope: null }; // null = 跟着模式走
const APPROVAL_OPTS = [

/* ================= 情绪条 =================
   四件事：光球颜色=她的心情 · 心情词 · 一句今天真发生的事 · 这周曲线。
   数据全部来自 lib.moodBar()（真数据：任务账本 / 今日聚合 / 她经手过的文件），**不造数**。
   心情是**她自己的心情**，不是用户的——规则见 lib.mjs 的 moodBar() 注释。 */
const MOOD_FALLBACK = { mood: 'calm', label: '松弛', level: 3, why: '', days: [], trend: '' };
let moodLast = MOOD_FALLBACK;
function paintMood(m) {
  const bar = $('mood');
  if (!bar) return;
  bar.style.setProperty('--mood', `var(--mood-${m.mood})`);
  $('mood-word-t').textContent = DT('home.js.tpl.4', '心情 {p1}', { p1: m.label });
  $('mood-why').textContent = m.why || '';
  $('mood-trend') && ($('mood-trend').textContent = m.trend ? DT('home.js.tpl.5', '这周 {p1}', { p1: m.trend }) : '');
  // 这周曲线：7 个点，**没记录的那天画空档**（不补假数据）
  const spark = $('mood-spark');
  if (spark) {
    const pts = m.days ?? [];
    const W = 76, H = 20, step = pts.length > 1 ? W / (pts.length - 1) : W;
    const y = (lv) => H - 2 - ((lv - 1) / 4) * (H - 5);
    const known = pts.map((d, i) => (d.level == null ? null : [i * step, y(d.level)])).filter(Boolean);
    const line = known.length > 1 ? `<polyline points="${known.map((p) => p.join(',')).join(' ')}" fill="none" stroke="var(--mood)" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>` : '';
    const dots = known.map((p) => `<circle cx="${p[0]}" cy="${p[1]}" r="1.9" fill="var(--mood)"/>`).join('');
    const gaps = pts.map((d, i) => (d.level == null ? `<circle cx="${i * step}" cy="${H - 2}" r="1" fill="var(--muted)" opacity=".5"/>` : '')).join('');
    spark.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${line}${gaps}${dots}</svg>`;
  }
}

  const m = await window.api.moodBar?.().catch(() => null);

  moodLast = m;
  paintMood(m);
}

/* ================= TA 状态卡 + 右栏聚合 ================= */
/* 原「TA 状态卡」那张紫色卡整张删掉（抒情文案已由情绪条替代），
   状态改由情绪条第 1 行的第三段承担——**更实时**（还是走 taskBus 广播），人话仍取自 STATE_LABELS。

function renderTaState(state) {

  /* ⚠ 两处修正：
     ① 原来直接写中文字面量，**把这行 static `data-i18n` 的译文盖回中文**——英文界面里家页正中那行
        永远是中文。
     ② 原来 `?? state` 兜底：状态一多，内部码（`Approval` 这种）会**直接显示给用户**。
     现在走词表：Idle 用 `home.mood-state.1`，其余用共享状态词的键 `state.<小写>`（九个都在词表里），
     真取不到才回落中文表——绝不把内部码端上去。 */
  const key = state === 'Idle' ? 'home.mood-state.1' : `state.${String(state ?? '').toLowerCase()}`;

/* 工作模式 → 右栏第一张卡升级为「工作台」：
   任务名 + 进度条 + 3/7 步 + 状态语言（statusWord 的人话）+ 步骤清单 + 控制（暂停/接着干/不做了）。
   数据全部来自 taskList()（账本已有），不新造状态。 */
/* ================= 右栏日历（一种网格 + 年月选择器）=================
   三条要求：① 日历太白看不清（→ 深玻璃，样式在上）② 切换年溢出
   ③「年月可切换但大小不能变化」。
   做法：**永远渲染 6 周（42 格）**，切年切月只换格子内容 → 容器高度天然不变；
   年 / 月各弹一个小选择器（年：上下各 100 年），不翻页、不换版面。
   ⚠ 别把巧合当契约：`monthGrid()` 返回的 cells 里**前导空是 null**，
     补满到 42 格要自己来（`calendarYear()` 那边另有个 `lead` 字段，语义是"星期几"，
     两处不是一回事——原实现靠 day1 恰好等于补空数"巧合工作"，这里不再赌）。 */
const CAL_WD = ['日', '一', '二', '三', '四', '五', '六'];
let calCursor = null;                // { y, m }
let calToday = null;

async function renderCalendar() {
  const body = $('cbody');
  if (!body || !$('yearchip')) return;
  try {
    if (!calToday) {
      const t = await window.api.calendarToday?.().catch(() => null);
      if (!t?.ok) { body.innerHTML = '<div class="cal-note"></div>'; body.firstChild.textContent = DT('home.cal.loading', '日历还在加载…'); return; }
      calToday = t.info;
      calCursor = { y: Number(calToday.date.slice(0, 4)), m: Number(calToday.date.slice(5, 7)) };
    }
    const { y, m } = calCursor;
    const mo = await window.api.calendarMonth?.(y, m).catch(() => null);
    const cells = (mo?.grid?.cells ?? []).slice();
    while (cells.length < 42) cells.push(null);      // 补满 6 周 → 高度写死
    $('yearchip').innerHTML = DT('home.js.tpl.8', '{p1} 年 <i>▾</i>', { p1: y });
    $('monthchip').innerHTML = DT('home.js.tpl.9', '{p1} 月 <i>▾</i>', { p1: m });
    body.innerHTML = `<div class="cal-wd">${CAL_WD.map((w) => `<span>${w}</span>`).join('')}</div>
      <div class="cal-cells">${cells.map((c) => calCell(c, calToday.date)).join('')}</div>
      ${mo?.holidaysKnown === false ? `<div class="cal-note">${y} 年的放假安排还没更新（按官方通知逐年更新）</div>` : ''}`;
    for (const el of body.querySelectorAll('[data-day]')) {
      el.addEventListener('click', (e) => { e.stopPropagation(); openDayPopup(el.dataset.day); });
    }
  } catch (e) {
    // 不许静默失败（空白 = 用户眼里的"假功能"）
    body.innerHTML = `<div class="cal-note">日历没渲染出来：${esc(e?.message ?? e)}</div>`;
  }
}

/** 月视图的一格：**只有日号**——
 *  农历/节气/节日/宜忌统统挪进点击后的弹框；格子只保留：今天高亮 + 假期/调休/生日的角标。
 *  「休 / 班」角标守 11px 下限，靠透明度 + 缩一档 + 靠右上让位来"不抢数字"。 */
function calCell(c, todayStr) {
  if (!c) return '<span class="cal-empty-cell"></span>';
  const n = Number(c.date.slice(8));
  const cls = ['cd'];
  if (c.date === todayStr) cls.push('cd-today');
  if (c.holiday) cls.push('cd-h');
  if (c.workday) cls.push('cd-w');
  const mark = c.holiday ? '休' : (c.workday ? '班' : ((c.birthdays?.length ?? 0) > 0 ? '🎂' : ''));
  return `<span class="${cls.join(' ')}" data-day="${c.date}" title="${esc(c.date)}（点开看这一天）"><b>${n}</b>${mark ? `<u>${esc(mark)}</u>` : ''}</span>`;
}

function closePicks() {
  const a = $('pick-year'), b = $('pick-month');
  if (a) a.hidden = true;
  if (b) b.hidden = true;
}
function renderYearPick() {
  const y = calCursor?.y ?? new Date().getFullYear();
  const list = $('ylist');
  if (!list) return;
  list.replaceChildren();
  for (let i = y - 100; i <= y + 100; i++) {
    list.append(UI2.h('button', {
      class: `yi${i === y ? ' on' : ''}`, text: DT('home.js.tpl.10', '{p1} 年', { p1: i }),
      onclick: () => { calCursor = { ...calCursor, y: i }; closePicks(); renderCalendar(); },
    }));
  }
  list.querySelector('.yi.on')?.scrollIntoView({ block: 'center' });
}
function renderMonthPick() {
  const list = $('mlist');
  if (!list) return;
  list.replaceChildren();
  for (let i = 1; i <= 12; i++) {
    list.append(UI2.h('button', {
      class: `mi${i === (calCursor?.m ?? 0) ? ' on' : ''}`, text: DT('home.js.tpl.11', '{p1} 月', { p1: i }),
      onclick: () => { calCursor = { ...calCursor, m: i }; closePicks(); renderCalendar(); },
    }));
  }
}
$('cprev')?.addEventListener('click', () => {
  if (!calCursor) return;
  let { y, m } = calCursor; m -= 1; if (m < 1) { m = 12; y -= 1; }
  calCursor = { y, m }; closePicks(); renderCalendar();
});
$('cnext')?.addEventListener('click', () => {
  if (!calCursor) return;
  let { y, m } = calCursor; m += 1; if (m > 12) { m = 1; y += 1; }
  calCursor = { y, m }; closePicks(); renderCalendar();
});
$('yearchip')?.addEventListener('click', (e) => {
  e.stopPropagation();
  const open = $('pick-year').hidden;
  closePicks();
  if (open) { renderYearPick(); $('pick-year').hidden = false; }
});
$('monthchip')?.addEventListener('click', (e) => {
  e.stopPropagation();
  const open = $('pick-month').hidden;
  closePicks();
  if (open) { renderMonthPick(); $('pick-month').hidden = false; }
});
document.addEventListener('click', (e) => { if (!e.target.closest('.cal')) closePicks(); });

/** 点某一天 → 弹框看那天的数据（农历/干支/节气/宜忌/生日） */
async function openDayPopup(dateStr) {
  const d = await window.api.calendarDay?.(dateStr).catch(() => null);
  if (!d?.ok) { UI2.Toast(DT('home.js.toast.3', '这天的数据读不出来'), ''); return; }
  const i = d.info;
  const badges = [
    i.holiday ? `<span class="dp-b dp-h">放假 · ${esc(i.holiday)}</span>` : '',
    i.workday ? `<span class="dp-b dp-w">${esc(i.workday)}</span>` : '',
    i.jieqi ? `<span class="dp-b dp-j">${esc(i.jieqi)}</span>` : '',
    (i.solarFestival && i.solarFestival !== i.holiday) ? `<span class="dp-b">${esc(i.solarFestival)}</span>` : '',
    (i.lunarFestival && i.lunarFestival !== i.holiday) ? `<span class="dp-b dp-j">${esc(i.lunarFestival)}</span>` : '',
    (i.birthdays ?? []).map((b) => `<span class="dp-b dp-bd">🎂 ${esc(b.label)}</span>`).join(''),
  ].filter(Boolean).join('');
  const html = `
    <div class="dp">
      <div class="dp-d">${Number(i.date.slice(5, 7))} 月 ${Number(i.date.slice(8))} 日 <span class="dp-wd">周${esc(i.weekday)}</span></div>
      <div class="dp-l">${esc(i.lunar ?? '')}　${esc(i.ganzhi ?? '')}${i.shengxiao ? `　属${esc(i.shengxiao)}` : ''}</div>
      ${badges ? `<div class="dp-bs">${badges}</div>` : ''}
      ${i.yi?.length ? `<div class="dp-y"><span>宜</span>${esc(i.yi.slice(0, 8).join('、'))}</div>` : ''}
      ${i.ji?.length ? `<div class="dp-j2"><span>忌</span>${esc(i.ji.slice(0, 8).join('、'))}</div>` : ''}
      <div class="dp-add" id="dp-add">＋ 把今天标成某个人的生日</div>
    </div>`;
  const mask = document.createElement('div');
  mask.className = 'dp-mask';
  mask.innerHTML = `<div class="dp-card">${html}</div>`;
  mask.addEventListener('click', (e) => { if (e.target === mask) mask.remove(); });
  document.body.append(mask);
  mask.querySelector('#dp-add').addEventListener('click', () => {
    // ⚠ 这里原来用 `prompt()` 收名字 —— Electron **根本不支持 prompt()**
    // （实测：`Error: prompt() is not supported.`）→ 这颗按钮一直是个死按钮，点了什么都不发生。
    // 改成组件库的 Modal + 一个输入框（UI2.Modal 这一版加了可选 input）。
    UI2.Modal({
      title: '这天是谁的生日？',
      body: '写个名字就行（比如：妈妈）。以后每年这天我都会标出来。',
      input: { placeholder: '名字' },
      actions: [{
        label: '记下',
        onClick: async (who) => {
          const name = String(who ?? '').trim();
          if (!name) { UI2.Toast(DT('home.js.toast.4', '没写名字，就没记'), 'err'); return; }
          const r = await window.api.birthdayAdd?.(i.date.slice(5), name).catch(() => null);
          UI2.Toast(r?.ok ? '记下了，每年这天我都会标出来' : (r?.error ?? '没记上'), r?.ok ? 'ok' : 'err');
          mask.remove();
          renderCalendar();
        },
      }],
    });
  });
}

/* ================= 今日待办（右栏下半）=================
   数据来自 `lib.todoList()`（todos.json；原子写、按天收起规则都在那边）。
   这一层只负责画与交互：优先级标签 + 事项（超长截两行）+ 来源 + 勾选框；
   **只列 5 条**，「全部 N 条 ›」是展开、不跳页。 */
const TODO_PRI_LABEL = { high: '高', mid: '中', low: '低' };
const TODO_PRI_CLASS = { high: 'p1', mid: 'p2', low: 'p3' };
const TODO_SRC_LABEL = { carry: '昨天留的', chat: '聊天里提到的', manual: '今天' };
let todoExpanded = false;

async function renderTodos() {
  const box = $('todo-list');
  if (!box) return;
  const list = await window.api.todoList?.().catch(() => null);
  const all = Array.isArray(list) ? list : [];
  const shown = todoExpanded ? all : all.slice(0, 5);
  box.replaceChildren();
  const more = $('todo-all');
  if (more) {
    more.style.display = all.length > 5 ? '' : 'none';
    more.textContent = todoExpanded ? '收起 ›' : DT('home.js.tpl.12', '全部 {p1} 条 ›', { p1: all.length });
  }
  if (!all.length) {
    box.append(UI2.h('div', { class: 'tempty', html: DT('home.todo.empty', '今天还没排事。<br>想到什么说一句，我替你记着。') }));
    return;
  }
  for (const it of shown) {
    const cls = `ti ${TODO_PRI_CLASS[it.priority] ?? 'p0'}${it.done ? ' done' : ''}`;
    const row = UI2.h('div', { class: cls, title: it.text }, [
      UI2.h('span', { class: 'pi' }, [UI2.h('span', { class: 'pd' }), TODO_PRI_LABEL[it.priority] ?? '默认']),
      UI2.h('span', { class: 'tt', text: it.text }),
      UI2.h('span', { class: `src${it.source === 'carry' ? ' carry' : ''}`, text: TODO_SRC_LABEL[it.source] ?? '' }),
      UI2.h('span', { class: 'ck', text: '✓' }),
    ]);
    // 点勾选框 = 勾上/取消；点别处 = 开小面板改优先级 / 不做了
    row.querySelector('.ck').addEventListener('click', async (e) => {
      e.stopPropagation();
      await window.api.todoToggle?.(it.id, !it.done).catch(() => null);
      renderTodos();
    });
    row.addEventListener('click', () => openTodoMenu(it));
    box.append(row);
  }
}

/** 一条待办的小面板：改优先级（高/中/低/默认）+ 不做了。
 *  「第二天可标注」就靠这里——昨天留的那条今天仍能标。 */
function openTodoMenu(it) {
  UI2.Modal({
    title: it.text,
    body: DT('home.js.tpl.13', '来源：{p1}　优先级：{p2}', { p1: TODO_SRC_LABEL[it.source] ?? '', p2: TODO_PRI_LABEL[it.priority] ?? '默认' }),
    actions: [
      { label: '高', onClick: () => { window.api.todoSetPriority?.(it.id, 'high'); renderTodos(); } },
      { label: '中', onClick: () => { window.api.todoSetPriority?.(it.id, 'mid'); renderTodos(); } },
      { label: '低', onClick: () => { window.api.todoSetPriority?.(it.id, 'low'); renderTodos(); } },
      { label: '默认', onClick: () => { window.api.todoSetPriority?.(it.id, null); renderTodos(); } },
      { label: '不做了', kind: 'danger', onClick: () => { window.api.todoRemove?.(it.id); renderTodos(); } },
    ],
  });
}

$('todo-all')?.addEventListener('click', () => { todoExpanded = !todoExpanded; renderTodos(); });
$('todo-add')?.addEventListener('click', () => {
  UI2.Modal({
    title: '加一条待办',
    body: '想到什么就写一句，她自己会看。',
    input: { placeholder: '比如：把桌面那批截图归档' },
    actions: [{
      label: '记下',
      onClick: async (text) => {
        const s = String(text ?? '').trim();
        if (!s) { UI2.Toast(DT('home.js.toast.5', '没写内容，就没记'), 'err'); return; }
        const r = await window.api.todoAdd?.(s).catch(() => null);
        UI2.Toast(r?.ok ? '记下了' : (r?.error ?? '没记上'), r?.ok ? 'ok' : 'err');
        renderTodos();
      },
    }],
  });
});

/* ================= ＋ 想让她做什么（上拉框）=================
   原「文件处理 / 深度思考」两张浮卡的职责搬到这里：
   · 处理文件 → 真动作：弹选文件，选完变成芯片（与拖文件进窗口同一条路）
   · 写点什么 / 找资料 / 定个提醒 → 预填一句**能直接接着写的开头**（不发送，补全意图）
   注意与「深度思考」的区别：那个是模式、填出来的「帮我想想:」没有信息（已删）；
   这三条是任务开头，补上宾语就能发。
   纪律：上拉框里的每一项都不许"填了却不给你选对象"。 */
const UP_OPENERS = { write: '帮我写：', find: '帮我找找：', remind: '提醒我 ' };
function prefill(text) { $('input').value = text; autoGrow(); $('input').focus(); }
// 从「工具」页的能力卡进来（查资料 / 写点东西）：开对话区 + 预填一句开头（不发送，补全意图而已）
window.api.onHomePrefill?.((text) => { openChat(); prefill(text); });
async function pickAndPrefill() {
  const r = await window.api.filePick().catch(() => null);
  if (!r?.ok || !r.paths?.length) return;      // 用户取消 → 什么都不做（别硬填）
  handFilesToInput(r.paths);
}
const upBox = $('up-box');
const plusBtn = $('plus-btn');
function closeUp() { upBox.hidden = true; plusBtn.classList.remove('on'); plusBtn.setAttribute('aria-expanded', 'false'); }
plusBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  const open = upBox.hidden;                    // 现在藏着 → 要展开
  upBox.hidden = !open;
  plusBtn.classList.toggle('on', open);
  plusBtn.setAttribute('aria-expanded', String(open));
});
document.addEventListener('click', (e) => { if (!e.target.closest('.up') && !e.target.closest('.plus')) closeUp(); });
for (const it of upBox.querySelectorAll('.it')) {
  it.addEventListener('click', async () => {
    const act = it.dataset.act;
    closeUp();
    if (act === 'file') { await pickAndPrefill(); return; }
    prefill(UP_OPENERS[act] ?? '');
  });
}

/* ================= 文件芯片 =================
   要求：「不要显示路径，文件用一个 UI 设计元素标注文件类的，输入框也一样」。
   两条规矩：
   ① **给内核的文本一个字都不变**——还是「… 帮我处理这个文件：/路径、/路径」。
      芯片只活在**显示层**，所以历史回放（chatHistory 拿回来的是原文）走同一套渲染，
      不用给消息格式加字段、不用改记忆里存的东西；
   ② 完整路径只在「在文件夹里看」时露（走已有的 previewReveal，见产物面板）。
   ⚠ 只对**我发出去的**消息做这个转换（她的话是她写的散文，里面出现路径不一定是文件）。 */
/** 打开一枚芯片 → 右侧产物面板（与「她改完东西自动滑出」是同一个面板） */
async function openPreview(p) {
  const r = await window.api.previewFile?.(p).catch(() => null);
  if (r?.ok) pvPanel.show({ path: r.path, name: r.name, html: r.html, text: r.text });
  else UI2.Toast(r?.error ?? '这个文件打不开', 'err');
}
/** 芯片要的元信息（轻量 fileInfo；拿不到就是 null —— 只显示文件名，不假装知道行数）。
 *  ⚠ 路径识别与芯片行**都在 components.js 一处实现**（`UI2.splitFilePaths` /
 *  `FileChipRow` / `attachFiles`）——对话房间此前是一串纯文本路径（同一应用两页不一致），
 *  把它收成一处才不会下次又漂。这里只负责**注入 IPC**（组件层不碰 window.api）。 */
const fileInfoOf = async (p) => { try { return (await window.api.fileInfo?.(p)) ?? null; } catch { return null; } };
const chipOpts = (extra = {}) => ({ fetchInfo: fileInfoOf, onOpen: openPreview, ...extra });
/* 输入框上方待发出的附件：文件芯片 + **粘贴进来的截图缩略图**（混排，同一个容器）
   截图必须"看得见才敢发"，所以缩略图就摆在这儿。 */
let pendingFiles = [];
let pendingImages = [];   // data URL 数组（剪贴板来的图）
const MAX_IMAGES = 4;     // 一次最多带 4 张（再多既贵又超端点单请求图数限制；超了如实说）
async function renderPendingFiles() {
  const box = $('file-chips');
  if (!box) return;
  box.replaceChildren();
  if (!pendingFiles.length && !pendingImages.length) { box.style.display = 'none'; return; }
  box.style.display = 'flex';
  pendingImages.forEach((src, i) => box.append(UI2.ImageThumb({
    src, caption: pendingImages.length > 1 ? DT('home.js.tpl.14', '截图 {p1}', { p1: i + 1 }) : '截图',
    onRemove: () => { pendingImages = pendingImages.filter((x) => x !== src); renderPendingFiles(); },
  })));
  if (pendingFiles.length) box.append(await UI2.FileChipRow(pendingFiles, chipOpts({
    onRemove: (p) => { pendingFiles = pendingFiles.filter((x) => x !== p); renderPendingFiles(); },
  })));
}
/** 剪贴板里的图 → 缩略图。**只认图**：纯文字粘贴照旧走浏览器默认行为（不要吞掉）。 */
function addPastedImage(dataUrl) {
  if (pendingImages.length >= MAX_IMAGES) { UI2.Toast(DT('home.js.tpl.15', '一次最多带 {p1} 张截图，先发一批或者去掉一张', { p1: MAX_IMAGES }), 'err'); return; }
  pendingImages.push(dataUrl);
  renderPendingFiles();
}
$('input').addEventListener('paste', (e) => {
  const items = [...(e.clipboardData?.items ?? [])].filter((it) => String(it.type ?? '').startsWith('image/'));
  if (!items.length) return;   // 没图 → 不拦，正常粘文字
  e.preventDefault();
  for (const it of items) {
    const file = it.getAsFile?.();
    if (!file) continue;
    const fr = new FileReader();
    fr.onload = () => addPastedImage(String(fr.result ?? ''));
    fr.onerror = () => UI2.Toast(DT('home.js.toast.6', '这张图没读出来，换个方式（拖进来或 📎）试试'), 'err');
    fr.readAsDataURL(file);
  }
});
function handFilesToInput(paths) {
  pendingFiles = [...new Set([...pendingFiles, ...paths])];
  renderPendingFiles();
  $('input').focus();
}
$('btn-mic').addEventListener('click', () => {
  UI2.Toast(DT('home.js.toast.7', '连按两下 Fn 键用系统听写说话,说完像打字一样发送'), '');
  $('input').focus();
});
window.addEventListener('dragover', (e) => { e.preventDefault(); if (e.dataTransfer) e.dataTransfer.dropEffect = 'copy'; });
window.addEventListener('drop', (e) => {
  e.preventDefault();
  // Electron 33 移除了 File.path（拖进来一直静默无反应）——改走 preload 的
  // webUtils.getPathForFile；真拿不到就不再静默，明说一句。
  const dropped = [...(e.dataTransfer?.files ?? [])];
  const paths = dropped.map((f) => window.api.getPathForFile?.(f) ?? '').filter(Boolean);
  if (paths.length) handFilesToInput(paths);
  else if (dropped.length) UI2.Toast(DT('home.js.toast.8', '没读到拖进来的文件路径——用左边的「＋ 想让她做什么」选文件也一样'), '');
});

/* 中央 Live2D 已撤（连 PETL2D/live2dcubismcore/pixi 三个 vendor 脚本一起卸掉）——
   家页不再加载任何模型，桌面宠物窗口（pet.html）才是形象的家。
   情绪价值由情绪条承担（见下方 renderMoodBar）。 */

/* ================= 聊天(自 index 迁入:流式五态/停止/重试/上下文连续) ================= */
const chatEl = $('chatlist');
let streamingEl = null;
/* 流式"只重画尾块"：
   ⚠ **不是每次 delta 重画整段 markdown** —— 流式期间用的是
     `textContent = 累积文本`（纯文本，没有解析 markdown），markdown 只在收尾渲染一次。
     真正的开销是那行**全量替换**：每个 delta 都重建整个文本节点（长回复 = O(n²) 的拷贝 + 整块重排）。
   现在改成：**分片数组 + 尾块 appendData** ——
     · `streamingChunks` 攒分片（收尾时才 join 一次，不再每个 delta 拼一次长子串）；
     · DOM 上只往**尾块**追加（`appendData` 一个动作），前面的文字一个字都不动。
   `syncStreamingFull()` 留给"整段同步"的场合（重载后 reattach 那半截）。 */
let streamingChunks = [];
let streamingTail = null;   // 尾块（文本节点）：delta 只动它
let lastSent = '';
let busy = false;

const nowTime = () => new Date().toTimeString().slice(0, 5);

function openChat() { $('chatlog').classList.add('open'); }

/** 收尾时把流式气泡换成渲染过排版的气泡——纯 textContent 会把 Markdown 原样显示 */
function finalizeBubble(bubble, text) {
  if (!bubble) return;
  // 动作卡：点了 = **你说了那句话**（走同一条 send()，不新开执行通道）。
  // ⚠ 家页这两处 `UI2.Message` 原来**没接 onAction** —— 卡片画得出按钮，
  //   点下去却什么都不发生（对话房间接了、家页没接：同一个功能两页不一样）。
  const rendered = UI2.Message({ role: 'assistant', text: text ?? '', onAction: (t) => { void send(t); } });
  const next = rendered.querySelector('.m-bubble');
  if (bubble.isConnected) bubble.replaceWith(next);
  else if (bubble.parentNode) bubble.parentNode.append(next);
}

/* ===== 审批卡 —— 你在哪个窗口，卡就在哪个窗口 =====
   以前这张卡**只有形象端有**，而事件又只发给家页与对话窗 → **真机上根本不会弹**
   （已改成广播到三个窗口，答完广播 approval-resolved 收起其余）。
   文案全部来自宿主一处（`approvalCardPayload`），这里只排版、不造句。 */
let approvalEl = null;
let approvalId = null;
function showApproval(d) {
  if (!d?.id) return;
  hideApproval();
  approvalId = d.id;
  approvalEl = UI2.ApprovalCard({
    title: d.title, why: d.why, impact: d.impact, raw: d.raw, risk: d.risk,
    // 缺 canSession 时按风险档推断（fail-safe：老调用方没带这个字段，不能当成"可以"）
    canSession: typeof d.canSession === 'boolean' ? d.canSession : d.risk !== 'R5',
    onDeny: () => window.api.approvalAnswer?.(d.id, 'deny'),
    onAllowOnce: () => window.api.approvalAnswer?.(d.id, 'allow'),
    onAllowSession: () => window.api.approvalAnswer?.(d.id, 'allow-session'),
    // 第三态：宿主能给出一条**窄规矩**时才有这颗按钮（给不出就是 undefined）
    canRule: d.canRule === true, ruleNote: d.ruleNote ?? '',
    onAllowRule: d.canRule === true ? () => window.api.approvalAnswer?.(d.id, 'allow-rule') : null,
  });
  // 家页空闲时对话区是收起的（`#chatlog.open`）——卡片塞进去等于看不见，
  // 所以先把对话区打开（她问事的时候，你至少得看得见这句问话）
  try { if (typeof openChat === 'function') openChat(); } catch { /* 老页面没有这个函数 */ }
  chatEl.append(approvalEl);
  chatEl.scrollTop = chatEl.scrollHeight;
  void labels.refresh();   // 刷新标签状态（挂按钮走上面那两行宿主 id）
}

/** 把宿主给的 id 认到这一行上（挂按钮前调用） */
function setMid(msgEl, mid) {
  if (msgEl && mid) msgEl.dataset.mid = String(mid);
  return msgEl;
}

document.getElementById('btn-labels').onclick = () => { void labels.open(); };
function hideApproval() { approvalEl?.remove(); approvalEl = null; approvalId = null; }
window.api.onApprovalAsk?.((d) => showApproval(d));
window.api.onApprovalResolved?.((d) => { if (!d?.id || d.id === approvalId) hideApproval(); });
/** 窗口重开/重载：把还在等的那一张重画出来（宿主 reattach/status 里带着 pending） */
function reshowPendingApproval(st) {
  const p = (st?.pending ?? [])[0];
  if (p?.id && p.id !== approvalId) showApproval(p);
  else if (!p) hideApproval();
}
/* 撤销这一轮改动（按钮替用户说出那句话；真正干活的是宿主那条路，与 `undo` 工具同一套动作）。
   先问一句再动手——它改的是用户的文件，静默执行不可接受；回执如实说"写回几个 / 删掉几个 / 哪几个没退成"。 */
async function undoThisTurn(turnId = null) {
  /* `turnId` = 产物卡自己那一轮。不传才退回"最近一轮"的老行为。 */
  const info = await window.api.turnChanges?.(turnId).catch(() => null);
  const n = info?.items?.length ?? 0;
  if (!n) { UI2.Toast(DT('home.js.toast.9', '这一轮没改过文件，没什么可退的'), ''); return false; }
  // 已经退过的回合：**先说清再拦**（后端还有同一道闸；这里是为了不让人走到"点了没反应"）
  if (info.undone) { UI2.Toast(DT('home.js.toast.20', '这一轮已经退回去过了——不重复退（再退会删掉你后来新建的文件）'), ''); return true; }
  const names = info.items.map((i) => `${String(i.path).split('/').pop()}${i.created ? '（新建）' : ''}`).join('、');
  const go = await new Promise((resolve) => {
    const box = document.createElement('div');
    box.textContent = DT('home.js.tpl.16', '这一轮改过 {p1} 个文件：{p2}。退回到改动前？这一轮新建的会送进回收站。', { p1: n, p2: names });
    UI2.Modal({ title: '撤销这次改动？', body: box, actions: [{ label: '退回去', onClick: () => resolve(true) }], onClose: () => resolve(false) });
  });
  if (!go) return false;
  const r = await window.api.undoLastTurn?.(turnId).catch(() => null);
  if (!r?.ok) { UI2.Toast(DT('home.js.toast.10', '没退成：') + (r?.error ?? '未知原因'), 'err'); return false; }
  const bad = (r.failed ?? []).length;
  const msg = DT('home.js.tpl.17', '退回去了：写回 {p1} 个', { p1: (r.restored ?? []).length })
    + ((r.removed ?? []).length ? DT('home.js.tpl.18', ' · 删掉新建 {p1} 个', { p1: r.removed.length }) : '')
    + (bad ? DT('home.js.tpl.19', ' · {p1} 个没退成', { p1: bad }) : '');
  UI2.Toast(msg, bad ? 'err' : 'ok');
  return true;
}


/* ===== 这次的产出（产物卡） =====
   只在**这一轮真做出来东西**时画（`chat()` 返回的 artifacts 就是本轮 `artifact.created`）；
   点「打开」走已有的预览、点「在文件夹里显示」走已有的 reveal——不新开通道。
   ⚠ 只列产出：她读过什么不算（那是文件页的活）。 */
function renderArtifacts(r, bubbleEl) {
  const items = r?.artifacts ?? [];
  if (!items.length) return;
  const card = UI2.ArtifactCard({
    items,
    onOpen: (a) => { if (a.path) void openPreview(a.path); },
    onReveal: (a) => { if (a.path) void window.api.previewReveal?.(a.path).catch(() => null); },
    onUndo: () => undoThisTurn(r?.turnId ?? null),   // 撤销**这一轮**改动（带上卡片自己那轮的 id）
  });
  if (!card) return;
  chatEl.append(card);   // 挂在**对话列**上整行铺开（塞进消息行会跟正文抢宽度 → 窄窗挤成竖排字）
  chatEl.scrollTop = chatEl.scrollHeight;
}

/* ===== 回到这句重说（对话树） =====
   只给**我的**消息挂动作（她的话不能"重说"）；点了 = 从这条消息分岔：
   宿主开一条新分支、站过去，并把**我的原话**交还输入框（注入前缀不算，宿主侧已经剥了）。 */
function attachLookback(msgEl, mid) {
  if (!msgEl || !mid || msgEl.dataset.lookback === '1') return;
  msgEl.dataset.lookback = '1';
  msgEl.dataset.mid = String(mid);
  msgEl.classList.add('lookback-able');
  if (msgEl.querySelector('.lookback')) return;
  const btn = document.createElement('button');
  btn.className = 'lookback';
  btn.type = 'button';
  btn.textContent = '↩ 回到这句重说';
  btn.title = '从这句重新说一遍：原来的那条分支会留着，随时能回去';
  btn.addEventListener('click', (e) => { e.stopPropagation(); void branchAt(String(mid)); });
  msgEl.append(btn);
}

/** 把最近对话画进对话区（原来这段是内联的；分支切换后要能重画，所以提成函数） */
/* ⚠ **只清"上一次画的历史"**，不清整块对话流——
   第一版用 `replaceChildren()` 清空，会把**在这之前刚落进来的审批卡**一起抹掉。
   换分支要整块重画时才用 `hard: true`。 */
async function loadHistory({ hard = false } = {}) {
  const hist = await window.api.chatHistory(12).catch(() => null);
  if (hard) chatEl.replaceChildren();
  else chatEl.querySelectorAll('[data-hist="1"]').forEach((n) => n.remove());
  if (hist?.ok && hist.chats.length) {
    for (const c of hist.chats) markHist(addMsg(c.role, c.text));
    markHist(addMsg('sys', '以上是最近的对话,接着聊就好。'));
  }
  await attachLookbacksFromSession();
  await attachLabelsFromSession();   // 历史行也挂上「🏷 标记」
}

/** 给"历史回放"画出来的节点打个标记（下次重画只删这些，别人的卡别动） */
function markHist(bubble) {
  const el = bubble && bubble.closest ? bubble.closest('.msg') : bubble;
  if (el && el.setAttribute) el.setAttribute('data-hist', '1');
  return bubble;
}

/** 给历史里的**我的**消息补挂「回到这句重说」：会话消息与日志里的"我说的话"**从后往前一一对上**。
    对不上的部分**不挂**——宁可少挂一个，也不能挂错（挂错会把"重说"落到别人的话上）。 */
async function attachLookbacksFromSession() {
  const sm = await window.api.sessionMessages?.(60).catch(() => null);
  if (!sm?.ok) return;
  const ids = sm.messages.filter((m) => m.role === 'user' && m.id).map((m) => m.id);
  const mine = [...chatEl.querySelectorAll('.msg.me')];
  const n = Math.min(ids.length, mine.length);
  for (let i = 1; i <= n; i++) attachLookback(mine[mine.length - i], ids[ids.length - i]);
}

/* ===== 标记（标签/书签） =====
   实现是**共用的那一份**（`UI2.LabelKit`，对话房间同一个）：标签是追加事实（再标覆盖、空串摘掉），
   对号入座靠正文不靠位置（标错人比不给标更糟，对不上就不挂）。这里只接本页的元素与宿主 IPC。 */
const labels = UI2.LabelKit({
  container: chatEl,
  onCountChange: (n) => {
    const el = document.getElementById('label-n');
    if (el) el.textContent = n ? String(n) : '';
    const btn = document.getElementById('btn-labels');
    if (btn) btn.title = n ? DT('home.js.tpl.20', '这一段标了 {p1} 处——点开看看', { p1: n }) : '这一段还没标过（把鼠标放到某句话上就能标）';
  },
});

/** 给画出来的行补挂「🏷 标记」（重说那条仍旧只挂我的，见上） */
async function attachLabelsFromSession() {
  const sm = await window.api.sessionMessages?.(60).catch(() => null);
  if (sm?.ok) labels.attachFromSession(sm.messages);
  await labels.refresh();
}

async function branchAt(mid) {
  const r = await window.api.chatBranch?.(mid).catch(() => null);
  if (!r || !r.ok) { UI2.Toast(r?.error === '没找到那条消息（可能已经被回退掉了）' ? '这句话已经不在当前分支上了' : (r?.error ?? '这次没分成，再试一次？'), 'err'); return; }
  if (input) { input.value = r.text || ''; autoGrow?.(); input.focus(); }
  await refreshBranchBar();
  UI2.Toast(DT('home.js.toast.11', '开了一条新分支，原来那条还在——想回去点上面的小标'), 'ok');
}

/** 分支小标：站在分支上才显示，点一下能切回去 */
async function refreshBranchBar() {
  const bar = document.getElementById('branch-bar');
  const info = await window.api.chatBranchInfo?.().catch(() => null);
  if (!bar || !info?.ok) return;
  if (!info.isBranch) { bar.classList.remove('on'); bar.replaceChildren(); return; }
  const list = await window.api.chatBranches?.().catch(() => null);
  const others = (list?.branches ?? []).filter((b) => !b.current);
  bar.replaceChildren();
  const label = document.createElement('span');
  label.textContent = '↩ 你现在在一条新分支上 —— 老的那条还在，随时能回去';
  bar.append(label);
  if (others.length) {
    const go = document.createElement('button');
    go.type = 'button';
    go.textContent = others.length === 1 ? '回到原来那条 ›' : DT('home.js.tpl.21', '回到别的分支（{p1} 条）›', { p1: others.length });
    go.addEventListener('click', async () => {
      const target = others.length === 1 ? others[0].id : await pickBranch(others);
      if (!target) return;
      const r = await window.api.chatBranchSwitch?.(target).catch(() => null);
      if (!r?.ok) { UI2.Toast(DT('home.js.toast.12', '切不过去：') + (r?.error ?? '未知原因'), 'err'); return; }
      await loadHistory();          // 把对话区换成那条分支的历史
      await refreshBranchBar();
      UI2.Toast(DT('home.js.toast.13', '回到那条分支了'), 'ok');
    });
    bar.append(go);
  }
  bar.classList.add('on');
}

function pickBranch(branches) {
  return new Promise((resolve) => {
    const wrap = document.createElement('div');
    for (const b of branches) {
      const row = document.createElement('button');
      row.type = 'button';
      row.className = 'btn sm ghost';
      row.style.display = 'block';
      row.style.margin = '4px 0';
      row.textContent = DT('home.js.tpl.22', '{p1}　（{p2} 条）', { p1: b.id, p2: b.count });
      row.addEventListener('click', () => { close(); resolve(b.id); });
      wrap.append(row);
    }
    const close = UI2.Modal({ title: '回到哪条分支？', body: wrap, onClose: () => resolve(null) });
  });
}

function addMsg(role, text) {
  // onAction 只对"她"的消息有意义（卡片只在她那侧渲染）；点了走同一条 send()（见 finalizeBubble 注释）
  const el = UI2.Message({ role: role === 'user' ? 'me' : role, text: role === 'sys' ? `${text} · ${nowTime()}` : text,
    onAction: (t) => { void send(t); } });
  chatEl.append(el);
  chatEl.scrollTop = chatEl.scrollHeight;
  const bubble = el.querySelector('.m-bubble');
  if (role === 'user') UI2.attachFiles(bubble, text, chipOpts());   // 路径 → 芯片（显示层；实现已收进 components.js）
  return bubble;
}
/* ===== 单一有序出口 + 回合登记 + 两档插话 =====
   每条 delta 带 { turnId, seq }：同回合 seq 递增；重放与实时重叠时按 seq 去重（不重不漏）。
   重载/重开窗：启动时 reattach 问全（在途半截 + 队列 + 待批 + 状态），再继续收流。 */
let curTurnId = null;
let lastSeq = 0;
let msgMode = 'steer'; // TA 忙时默认插话；可切「排队」（followup）
/* 滚动**合并到每帧一次**。
   实测：每个 delta 都读一次 `scrollHeight` 会把每 delta 的成本从 ~0.02ms 拉到 ~15ms
   ——读 `scrollHeight` 强制同步重排（layout thrashing），1500 个 delta 就是 22 秒。
   现在：一帧之内不管来多少 delta，只滚一次（`requestAnimationFrame` 合并）。 */
let scrollQueued = false;
function scrollToBottomSoon() {
  if (scrollQueued) return;
  scrollQueued = true;
  requestAnimationFrame(() => { scrollQueued = false; chatEl.scrollTop = chatEl.scrollHeight; });
}
function streamingText() { return streamingChunks.join(''); }
function ensureStreamingBubble() {
  if (!streamingEl) { openChat(); streamingEl = addMsg('assistant', ''); syncStreamingFull(streamingText()); }
  return streamingEl;
}
/** 整段同步（重载/reattach 用）：重置尾块引用 */
function syncStreamingFull(text) {
  const el = ensureStreamingBubble();
  el.textContent = String(text ?? '');
  streamingTail = el.firstChild ?? null;
  return el;
}
/** 只动尾块：delta 的常规路径（不重建、不拼接、不整块重排） */
function pushDelta(chunk) {
  const d = String(chunk ?? '');
  if (!d) return ensureStreamingBubble();
  streamingChunks.push(d);
  /* ⚠ 这里**不能**用 ensureStreamingBubble()：新建气泡时它会把 `streamingChunks` 里已有的内容
     先同步进去，而下面又要 appendData 同一块 —— 第一个 delta 会被写**两遍**（实测多出 9 个字）。
     新建气泡时留空，让尾块负责写。 */
  if (!streamingEl) { if (typeof openChat === 'function') openChat(); streamingEl = addMsg('assistant', ''); streamingTail = null; }
  const el = streamingEl;
  if (!streamingTail || streamingTail.parentNode !== el) {
    el.textContent = '';
    streamingTail = document.createTextNode('');
    el.append(streamingTail);
  }
  streamingTail.appendData(d);
  return el;
}
/* ===== 过程可见 =====
   关键节点：每个工具起止一行（⋯ → ✓/✗）；思考摘要只在**灵核家**显示（形象端不给，安全分层）。
   证据卡：工作模式收尾时由**内核**产出（不是她的话）——"凭什么说做完了"看得见。 */
let stepFlow = null;
function resetSteps() { if (stepFlow) stepFlow.finish(); }   // 只收尾，**不丢引用**（迟到的那一步要落回同一块）
function newTurnSteps() { if (stepFlow) { stepFlow.finish(); stepFlow = null; } }  // 新回合：上一块留在原地，下一条步骤开新块
/* 进行中状态行。
   我们的回复是整包缓冲的（等的时候一个字都不出），这行字靠**本地计时**，不依赖任何 delta。 */
let pendingEl = null;
function startPending() {
  settlePending();
  openChat();
  pendingEl = UI2.Pending();
  chatEl.append(pendingEl.el); // 插在她即将说话的位置（冻结后就是答复上方的抬头）
}
function settlePending() { if (pendingEl) { pendingEl.settle(); pendingEl = null; } }
/* 这里原先有一份 PENDING_TEXT 表——和形象端那份、组件里那份三份并存。
   现在**一行表都不留**：词由宿主随 task-state 事件广播（ev.pending = 「正在思考」这类进行态用词，
   ev.step = 她正在做的那一步的粗粒度说法「正在看资料」）。一处真源见 ui/state-words.js。 */
function noteStateToPending(ev) {
  if (!pendingEl) return;
  const st = ev?.to ?? ev?.state;
  const word = ev?.pending;
  if (!word) return;
  // 她在动手时，那行字要说**在做什么**（"正在看资料"比"正在动手"有用得多）
  pendingEl.setText(st === 'Working' && ev?.step ? ev.step : word);
}
/* 过程块收编成 UI2.StepFlow（组件在 components.js，conv 页也能用同一套）。
   三态 ✓/◐/○ + 右侧耗时 + 进行中脉冲点；干完默认折叠成一行「做了 N 步（点开看）」。 */
function ensureStepBox() {
  if (!stepFlow || !stepFlow.el.isConnected) {
    openChat();
    stepFlow = UI2.StepFlow();
    chatEl.append(stepFlow.el);
  } else stepFlow.reopen();   // 收尾后迟到的步骤（验证回读）接着用这一块
  return stepFlow;
}
window.api.onChatStep((ev) => {
  try {
    const flow = ensureStepBox();
    if (ev.phase === 'start') flow.start(ev);   // 带 by 的 = 分身干的活（缩进挂名）
    else flow.end(ev);
    chatEl.scrollTop = chatEl.scrollHeight;
  } catch { /* 过程块渲染失败不影响聊天 */ }
});
window.api.onChatThink((d) => {
  /* ⚠ 修正：
     从前这里是 `ensureStepBox().think(...)` —— `ensureStepBox()` **会创建**过程卡，
     于是**光有思考就会画出一整张「她的过程」**：闲聊时模型也会吐 reasoning（reasoning 模型尤甚），
     卡片里于是只有一条没头没尾的思考引文 + 一个"进行中"，看着就像坏了。
     现在：**思考只挂进"已经存在的"卡片**（卡片由真正的工具步骤创建），思考本身不再创建卡片。
     ⚠ 代价说清（有意的取舍）：一次任务里"先想、再动手"的那**第一段思考**不再上屏
     （它在第一个工具步骤之前到达）。过程卡是"她动了什么手"，不是"她脑子里过了一遍什么"。 */
  try { stepFlow?.think?.(String(d?.text ?? '')); } catch { /* 忽略 */ }
});
/** 结果卡（原证据卡）：绿色 ✓ 头 + 逐条问题 + 动作。
 *  数据来自内核验证契约（`verification`），confidence 是**系统自估、不是事实**——卡上如实标注。
 *  顺带把工作台那张卡的**能力**搬到这里（删卡、保能力）：
 *  暂停 / 接着干 / 不做了 + 产物入口（打开结果 / 在文件夹里看）。 */
async function addEvidenceCard(v, files) {
  if (!v) return;
  openChat();
  const all = v.evidence ?? [];
  const lines = all.slice(0, 6).map((e) => ({
    mark: e.status === 'passed' ? '✓' : e.status === 'failed' ? '✗' : '·',
    tone: e.status === 'failed' ? 'fail' : '',
    // 兜底句不许同义反复，也**不许把工具名甩到脸上**（"read / write" 是内部标识）。
    //   弱证据（type=tool-ok）的 target 就是工具名 → 只留那句话，不加前缀。
    text: e.type === 'tool-ok'
      ? (e.detail || '')
      : `${String(e.target ?? '').split('/').pop()}：${e.detail || ''}`,
  }));
  // 截断要如实说：此前 slice(0,6) 之后一句话都不交代，用户以为证据就这么多
  if (all.length > lines.length) lines.push({ mark: '', tone: '', text: DT('home.js.tpl.23', '还有 {p1} 条没列出来', { p1: all.length - lines.length }) });
  // ⚠ `files` 是**路径字符串数组**（lib 的 changedFiles），不是对象数组——
  //   对象那版是 main.mjs 过完 previewFile 之后推给预览面板的（`files-changed`）。
  //   第一版照对象写（`f?.path`），结果字符串上取不到 .path → 三个动作一个都不出。
  const paths = (files ?? []).map((f) => (typeof f === 'string' ? f : f?.path)).filter(Boolean);
  const acts = [];
  if (paths.length) {
    acts.push({ label: '打开结果', pri: true, onClick: () => openPreview(paths[0]) });
    acts.push({ label: '在文件夹里看', onClick: () => window.api.previewReveal?.(paths[0]) });
  }
  const card = UI2.ResultCard({
    title: v.passed ? '这一件做完了' : '没全做完',
    ok: !!v.passed,
    lines,
    note: DT('home.js.tpl.24', '她的自估：{p1}%（系统内部估计，不是事实）', { p1: Math.round((v.confidence ?? 0) * 100) }),
    actions: acts,
  });
  chatEl.append(card);
  chatEl.scrollTop = chatEl.scrollHeight;
  // 任务控件（从右栏工作台搬过来）：有活就挂上，点一下按最新状态重画
  try {
    const list = await window.api.taskList();
    const run = (list ?? []).find((r) => ['running', 'blocked', 'paused', 'usage_limited', 'budget_limited', 'pending'].includes(r.state))
      ?? (list ?? [])[0];
    if (!run) return;
    const box = UI2.h('div', { class: 'wb-ops' });
    const paint = async () => {
      const list2 = await window.api.taskList().catch(() => []);
      const r2 = (list2 ?? []).find((x) => x.id === run.id) ?? run;
      const p = r2.progress ?? { done: 0, total: 0 };
      box.replaceChildren();
      box.append(UI2.h('div', { class: 'wb-sub', text: `${r2.title || '手头这件事'} · ${p.done}/${p.total} 步${r2.label ? ` · ${r2.label}` : ''}` }));
      const ops = UI2.h('div', { class: 'ops', style: { marginTop: '6px' } });
      if (['running', 'pending'].includes(r2.state)) {
        ops.append(UI2.h('button', { class: 'op plain', text: '暂停', onclick: async (e) => { e.stopPropagation(); await window.api.taskControl(r2.id, 'pause'); UI2.Toast(DT('home.js.toast.14', '好，先停下了')); paint(); } }));
      } else if (['paused', 'blocked', 'usage_limited', 'budget_limited'].includes(r2.state)) {
        ops.append(UI2.h('button', { class: 'op', text: '接着干', onclick: async (e) => { e.stopPropagation(); const r = await window.api.taskControl(r2.id, 'resume'); UI2.Toast(r?.text ?? '好'); paint(); } }));
      }
      ops.append(UI2.h('button', { class: 'op plain', style: { color: 'var(--danger)' }, text: '不做了', onclick: async (e) => { e.stopPropagation(); await window.api.taskControl(r2.id, 'cancel'); UI2.Toast(DT('home.js.toast.15', '好，这件事不做了')); paint(); } }));
      box.append(ops);
    };
    await paint();
    card.append(box);
    chatEl.scrollTop = chatEl.scrollHeight;
  } catch { /* 账本没挂上 → 只出结果卡，不挂控件 */ }
}

/* 把处理函数**起个名字**（原来是个匿名箭头函数）——生产路径一字不改，
   测试也可以**走同一条路**喂 delta。 */
function handleChatDelta(d) {
  if (typeof d === 'string') { // 兼容旧格式
    pushDelta(d);
    chatEl.scrollTop = chatEl.scrollHeight;
    return;
  }
  if (!d || typeof d !== 'object') return;
  if (d.turnId !== curTurnId) {
    curTurnId = d.turnId; lastSeq = 0;
    if (streamingChunks.length) { streamingChunks = []; streamingTail = null; streamingEl = null; } // 上一回合残留 → 另起气泡
  }
  if (d.seq && d.seq <= lastSeq) return; // 重放与实时重叠 → 去重
  lastSeq = d.seq || lastSeq;
  openChat();
  pushDelta(d.text ?? '');
  scrollToBottomSoon();
}
window.api.onChatDelta(handleChatDelta);
// 回合收尾统一事件：正常路径由 send() 的 promise 渲染；重载后 promise 没了，从这里回填
window.api.onChatFinal?.((d) => {
  setTimeout(resetSteps, 300); // 这一轮的过程块留在原地，下一轮重新开一块
  if (d?.verification) addEvidenceCard(d.verification, d?.files); // 结果卡先出（它是数据，不依赖流式气泡）
  if (!d || (curTurnId && d.turnId !== curTurnId)) return;
  const bubble = streamingEl;
  if (!bubble) return;
  streamingEl = null;
  streamingChunks = []; streamingTail = null;
  if (d.ok) { finalizeBubble(bubble, d.reply); return; }
  if (d.aborted) {
    // 打断保留半截（说"继续"能接着写）
    if (d.reply && d.reply.trim()) finalizeBubble(bubble, d.reply);
    else UI2.replaceMsg(bubble, UI2.SystemCard({ text: DT('home.js.card.1', '好，先停下了，想继续时告诉我。'), tone: 'note' }));
    return;
  }
  // 失败=**独立系统卡**，且换的是整条消息（UI2.replaceMsg 找外层 .msg）。
  //   旧写法 `bubble.replaceWith(整条消息)` 把新消息套进原气泡 → 双头像 + 正文左边缘 61→100px 错位。
  UI2.replaceMsg(bubble, UI2.SystemCard({
    text: DT('home.js.tpl.25', '这次没完成：{p1}', { p1: d.reply || d.error || '不知道哪里出了问题' }),
    ops: [{ label: '重试', onClick: () => send(lastSent) }],
  }));
});
// TA 主动说的一句话（心跳/定时任务/里程碑）——进对话流，像在同一条对话里继续
window.api.onChatProactive?.((d) => {
  if (!d?.text) return;
  openChat();
  addMsg('assistant', d.text);
  chatEl.scrollTop = chatEl.scrollHeight;
});
// 队列行：TA 在忙时的插话/排队都显示在输入框上方，可一键取回
function renderQueue(q) {
  const box = $('queue-rows');
  const items = [
    ...(q?.steers ?? []).map((it) => ({ ...it, kind: 'steer' })),
    ...(q?.followups ?? []).map((it) => ({ ...it, kind: 'followup' })),
  ];
  box.innerHTML = '';
  if (!items.length) { box.style.display = 'none'; return; }
  box.style.display = 'flex';
  for (const it of items) {
    const row = document.createElement('div');
    row.style.cssText = 'display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink2)';
    row.append(UI2.h('span', { style: { flex: 'none', opacity: .7 }, text: it.kind === 'steer' ? '插话' : '排队' }));
    row.append(UI2.h('span', { style: { flex: '1', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }, text: it.text }));
    row.append(UI2.h('button', {
      class: 'ghost', style: { width: 'auto', padding: '2px 8px', fontSize: '12px', flex: 'none' }, text: '取回',
      onclick: async () => {
        const r = await window.api.chatQueueTake(it.kind, it.id).catch(() => null);
        if (r?.ok) { $('input').value = r.item.text; $('input').focus(); }
      },
    }));
    box.append(row);
  }
}
window.api.onChatQueue?.((q) => renderQueue(q));
// 会话状态（谁在等你）——busy 由主进程状态驱动，多窗口一致
window.api.onSessionStatus?.((st) => {
  setBusy(st?.state === 'Active');
});
window.api.onOpenChatlog?.(() => openChat()); // Quick「展开完整对话」→ Home 聊天流展开
/* 说「聊聊/陪陪我」→ TA 邀请进对话房间(轻条,点击进房间) */
window.api.onConvInvite?.(() => {
  if ($('conv-invite')) return;
  const bar = UI2.h('div', {
    id: 'conv-invite', class: 'anim-in',
    style: { position: 'absolute', top: '16px', left: '50%', transform: 'translateX(-50%)', zIndex: 30,
      fontSize: '12.5px', color: 'var(--white)', cursor: 'pointer', textAlign: 'center',
      padding: '10px 20px', borderRadius: '999px',
      background: 'var(--night-82)', backdropFilter: 'blur(14px)', border: '1px solid var(--pri-lite-a30)',
      boxShadow: '0 10px 30px var(--scrim-30)' },
    onclick: () => { window.api.convOpen(); bar.remove(); },
  }, 'TA:想找个舒服的地方聊？进对话房间 ›');
  document.body.append(bar);
  setTimeout(() => bar.remove(), 20000);
});

/* 产物面板——她改完东西自动滑出（右侧），可看源码 / 打开 / 在访达中显示 */
const pvPanel = UI2.PreviewPanel({
  onOpen: (p) => window.api.previewOpenExternal?.(p),
  onReveal: (p) => window.api.previewReveal?.(p),
});
document.body.append(pvPanel.el);
window.api.onFilesChanged?.((list) => {
  const first = (list ?? []).find((x) => x?.html);
  if (first) pvPanel.show(first);
});

function setBusy(on) {
  busy = on;
  const btn = $('send');
  btn.textContent = on ? '■' : '➤';
  btn.classList.toggle('stop', on);
  btn.title = on ? '停止' : '发送';
  const chip = $('msg-mode');   // 原先写的是 $('mode-chip')，撞上了问候语下那颗模式胶囊的 id
  if (chip) chip.style.display = on ? '' : 'none';
}
$('msg-mode').onclick = () => {
  msgMode = msgMode === 'steer' ? 'followup' : 'steer';
  $('msg-mode').textContent = msgMode === 'steer' ? '插话' : '排队';
  UI2.Toast(msgMode === 'steer' ? 'TA 干活时，你说的话会马上插进去（改主意）' : 'TA 干活时，你说的话会排队等它做完', '');
};

let stopped = false; // 用户主动点停止 → 收尾不显「没完成+重试」,改人话安抚
async function send(textIn) {
  const input = $('input');
  const fromComposer = textIn == null;   // 重试/接力传进来的已经是拼好的原文，别再拼第二次
  let text = String(textIn ?? input.value).trim();
  // 输入框上挂着的文件芯片 → 拼回内核看得懂的文本（**与老格式逐字一致**）
  if (fromComposer && pendingFiles.length) {
    const list = pendingFiles.join('、');
    text = text ? DT('home.js.tpl.26', '{p1} 帮我处理这个文件：{p2}', { p1: text, p2: list }) : DT('home.js.tpl.27', '帮我处理这个文件：{p1}', { p1: list });
  }
  const images = fromComposer ? pendingImages : [];
  if (!text && !images.length) return;
  if (busy) {
    // ⚠ 插话/排队这两条通道**不带图**（内核只有整回合那条路能看图）——图还挂在框上时
    //   不许走插话：否则图片会被静默丢掉。说清楚，留着她忙完再发。
    if (images.length) { UI2.Toast(DT('home.js.toast.16', '她手上还有活——等这一轮完了再发图，先给你留在框里'), ''); return; }
    // TA 在忙——默认插话（下一个工具轮次就看到），可按「插话/排队」切换
    input.value = '';
    const r = msgMode === 'followup'
      ? await window.api.chatFollowUp(text).catch(() => null)
      : await window.api.chatSteer(text, curTurnId).catch(() => null);
    if (r?.ok) {
      if (r.mode === 'requeued') UI2.Toast(DT('home.js.toast.17', '上一件事已经结束了——这句排到队里，TA 做完就来'), '');
      $('input').focus();
      return;
    }
    if (r?.reason === 'no-active-turn') { setBusy(false); return send(text); } // 刚好忙完 → 直接发
    UI2.Toast(r?.error ?? '没插上，再试一次', 'err');
    input.value = text;
    return;
  }
  // 只粘了图、没打字：给一句中性的话（内核需要一句 prompt；这不是替用户说话，是补个最小的话头）
  if (!text && images.length) text = images.length > 1 ? '看看这几张截图' : '看看这张截图';
  input.value = '';
  autoGrow();   // 发完缩回一行（不然空框还撑着上次的高度）
  if (fromComposer && (pendingFiles.length || pendingImages.length)) { pendingFiles = []; pendingImages = []; renderPendingFiles(); }
  lastSent = text;
  stopped = false;
  newTurnSteps();   // 新回合 → 上一块过程收尾留在原地，这一轮的步骤开新块
  openChat();
  const userMsgEl = addMsg('user', text);
  startPending(); // 发话即出现（本地计时）；空气泡由 CSS 藏起来，等有内容再露头
  streamingChunks = []; streamingTail = null;
  streamingEl = addMsg('assistant', '');
  streamingEl.textContent = '';
  curTurnId = null; lastSeq = 0; // 新回合：由第一条 delta 带 turnId 认领
  setBusy(true);
  let r;
  try { r = await window.api.chat(text, images); } catch (e) { r = { ok: false, error: e?.message ?? String(e) }; }
  settlePending(); // 回合收敛的唯一出口（ok / 中止 / 报错都走这里）
  setBusy(false);
  /* ⚠ 原来这里先 `renderArtifacts(r, bubble)`、`const bubble` 却声明在后面 ——
     **暂时性死区**当场抛 ReferenceError，于是这一轮的产物卡根本没画过、
     中止/报错那两条收尾分支也永远走不到（外观上看不出来：流式的字早就贴上去了）。
     与对话房间同一处错，一起摆正。 */
  const bubble = streamingEl;
  streamingEl = null;
  streamingChunks = []; streamingTail = null;
  if (r?.mid) attachLookback(userMsgEl?.closest?.('.msg') ?? null, r.mid);   // 回到这句重说
  renderArtifacts(r, bubble);                                                // 这次的产出
  void refreshBranchBar();
  /* 这一轮的**我和你**都用宿主给的 id 挂「🏷 标记」（不按正文猜——
     带路径的话在页面上会变成文件芯片，正文对不上）。 */
  if (r?.mid) labels.attach(setMid(userMsgEl?.closest?.('.msg') ?? null, r.mid));
  if (r?.aid) labels.attach(setMid(bubble?.closest?.('.msg') ?? null, r.aid));
  if (!bubble) { void attachLabelsFromSession(); return; } // chat-final 事件已渲染（事件先于 promise 到达：重载后就是这条路）
  if (stopped || r.aborted) {
    // 打断保留半截（说"继续"能接着写）；没内容才给人话安抚
    if (r.reply && String(r.reply).trim() && !/^（已停止）$/.test(String(r.reply))) finalizeBubble(bubble, r.reply);
    else UI2.replaceMsg(bubble, UI2.SystemCard({ text: DT('home.js.card.2', '好，先停下了，想继续时告诉我。'), tone: 'note' }));
  } else if (r.ok) {
    finalizeBubble(bubble, r.reply);
  } else {
    // 同上一条路，统一成**独立系统卡**（不再 `innerHTML=''` 再套一层消息）
    // lib 失败时 reply 常是人话(如缺配置说明),error 才是机器码 → 人话优先
    UI2.replaceMsg(bubble, UI2.SystemCard({
      text: DT('home.js.tpl.28', '这次没完成：{p1}', { p1: r.reply || r.error || '不知道哪里出了问题' }),
      ops: [{ label: '重试', onClick: () => send(lastSent) }],
    }));
  }
  chatEl.scrollTop = chatEl.scrollHeight;
}

/** 停止（按钮/ESC 共用）：中止当前回合 + 队列原文交还输入框 */
async function stopCurrent() {
  stopped = true;
  const r = await window.api.chatStop().catch(() => null);
  const items = r?.returned ?? [];
  if (items.length) {
    const input = $('input');
    input.value = [input.value.trim(), ...items.map((it) => it.text)].filter(Boolean).join('\n');
    UI2.Toast(DT('home.js.toast.18', '把还没轮到的话放回输入框了'), '');
    input.focus();
  }
}
$('send').addEventListener('click', () => {
  if (!busy) { void send(); return; }
  void stopCurrent();
});
$('input').addEventListener('keydown', (e) => {
  // 多行输入：Enter 发送照旧；**Shift+Enter 换行**（textarea 的默认行为，不拦）
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); void send(); }
  else if (e.key === 'Escape') { e.preventDefault(); void stopCurrent(); }
});
/** 输入框跟着内容长高（1 行起步、最多 5 行左右，再多就内部滚动）。
 *  为什么要它：换成多行输入之后，固定高度会让第二行文字直接被裁掉（textarea 不会自己长）。 */
function autoGrow() {
  const el = $('input');
  if (!el) return;
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 132) + 'px';
}
$('input').addEventListener('input', autoGrow);
autoGrow();
// 📎 附文件：与「＋ 想让她做什么 → 处理文件」同一条路（都是选文件挂芯片），只是多一颗好按的钮
$('btn-attach').addEventListener('click', () => { void pickAndPrefill(); });

/* ================= Task State(输入即 Listening→Thinking→Working,失败人话;main 广播) ================= */
let taskBusLast = { state: 'Idle', detail: null };
function applyState(ev) {
  const st = ev?.to ?? ev?.state ?? 'Idle';
  taskBusLast = { state: st, detail: ev?.detail ?? null };
  renderTaState(st);
  // 右栏那张「正在进行」卡删掉了 → 状态改由情绪条第 1 行承担（renderTaState）。
  // ⚠ 但 `noteStateToPending` **必须留着**：它把状态写进对话流里那行「正在思考 / 正在干活」，
  //   原先是搭在 renderDoing 里顺手调的，删卡时最容易连带删掉（删了界面上就少一行，不容易发现）。
  noteStateToPending(ev);
  if (st === 'Success' || st === 'Error' || st === 'Cancelled') {
    setTimeout(() => { if (!busy) renderTaState('Idle'); }, 2600); // 展示后 UI 层回落 Idle
  }
}
window.api.onTaskState?.(applyState);

/* ================= 启动 ================= */
(async () => {
  try {
    const s = await window.api.status();
    if (!s?.bound) { UI2.Toast(DT('home.js.toast.19', 'TA 还没有出生,先完成出生向导吧。')); return; }
    const prof = await window.api.petProfile().catch(() => null);
    const taName = prof?.selections?.name || 'TA';
    $('nav-ta-name').textContent = taName;
    $('mood-name').textContent = taName;   // 情绪条上也用她的名字（漏了这行就一直是「TA」）
    const cur = await window.api.taskStateGet?.().catch(() => null); // 打开 Home 前可能已有任务在跑,同步真实态
    taskBusLast = { state: cur?.state ?? 'Idle', detail: null };
    renderTaState(cur?.state ?? 'Idle');
    await renderTodos();
    renderCalendar();
    // 上下文连续:最近聊天接进来(只读展示,不重复入库;不自动展开聊天流,保持 Home 纯净)
    await loadHistory();
    // 在途回合/队列/待批/状态一次问全——重载不丢话
    const ra = await window.api.chatReattach?.().catch(() => null);
    if (ra?.ok) {
      if (ra.turn) {
        curTurnId = ra.turn.id; lastSeq = ra.turn.seq;
        if (ra.turn.text) {
          streamingChunks = [ra.turn.text]; streamingTail = null; streamingEl = null;
          openChat();
          streamingEl = addMsg('assistant', '');
          syncStreamingFull(ra.turn.text);
        }
      }
      setBusy(ra.status?.state === 'Active');
      renderQueue(ra.queue);
    }
  } catch { /* 任一数据源失败:Home 主体(问候/输入/形象)照常可用,卡片留空态 */ }
})();
setInterval(renderTodos, 5 * 60 * 1000);
</script>
